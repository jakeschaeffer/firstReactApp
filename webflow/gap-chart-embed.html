<!-- Capability-gap chart. Paste this whole block into a Webflow
     Embed element. Attributes on <gap-chart> override the label text;
     see webflow/README.md in the repo for colors + options.
     If you prefer a plain image, use gap-chart.svg / gap-chart.png instead. -->
<gap-chart></gap-chart>
<script>
(function () {
'use strict';
if (!window.customElements || customElements.get('gap-chart')) return;
var TEXT = {
'label-top': 'What models can do',
'label-bottom': 'What businesses actually use',
'label-gap': 'The gap',
'label-gap-sub': 'is our opportunity',
'tick-start': '2023',
'tick-today': 'Today',
'tick-end': '2030',
'alt': 'Chart: from 2023 to 2030, what AI models can do grows exponentially while what businesses actually use grows roughly linearly. The widening gap between the two lines is our opportunity.'
};
class GapChart extends HTMLElement {
constructor() {
super();
this.root = this.attachShadow({ mode: 'open' });
this._pin = null;
this._raf = 0;
}
connectedCallback() {
var self = this;
this._ro = new ResizeObserver(function () {
cancelAnimationFrame(self._raf);
self._raf = requestAnimationFrame(function () { self.render(); });
});
this._ro.observe(this);
this.render();
}
disconnectedCallback() {
if (this._ro) this._ro.disconnect();
cancelAnimationFrame(this._raf);
}
a(n) {
return String(this.getAttribute(n) || TEXT[n] || '')
.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}
render() {
var w = this.clientWidth || 720;
var ratio = parseFloat(this.getAttribute('ratio')) ||
(w < 480 ? 0.74 : w < 760 ? 0.54 : 0.4);
var h = Math.max(210, Math.min(600, Math.round(w * ratio)));
var fs = Math.max(12, Math.min(17, Math.round(w * 0.018)));
var fst = Math.max(11, fs - 3);
var lw = w < 480 ? 2 : w < 900 ? 2.4 : 2.8;
var padL = 6, padR = 6;
var padT = Math.round(h * 0.04) + 4;
var padB = Math.round(fst * 2.2) + 4;
var pw = w - padL - padR, ph = h - padT - padB;
var X = function (t) { return +(padL + t * pw).toFixed(1); };
var Y = function (v) { return +(padT + (1 - v) * ph).toFixed(1); };
var k = parseFloat(this.getAttribute('curve')) || 2.4;
var b0 = 0.012;
var expo = function (t) {
return b0 + (Math.exp(k * t) - 1) / (Math.exp(k) - 1) * (0.985 - b0);
};
var lin = function (t) { return b0 + t * 0.165; };
var top = '';
for (var i = 0; i <= 64; i++) {
var t = i / 64;
top += (i ? 'L' : 'M') + X(t) + ' ' + Y(expo(t));
}
var area = top + 'L' + X(1) + ' ' + Y(lin(1)) +
'L' + X(0) + ' ' + Y(lin(0)) + 'Z';
var bot = 'M' + X(0) + ' ' + Y(lin(0)) + 'L' + X(1) + ' ' + Y(lin(1));
var tx = Math.min(0.96, Math.max(0.04,
parseFloat(this.getAttribute('today')) || 0.42));
var subLen = String(this.getAttribute('label-gap-sub') || TEXT['label-gap-sub']).length;
var subW = fs * 0.5 * subLen;
var gcx = X(0.97) - subW / 2;
var gLeft = Math.max(0, 0.97 - subW / pw);
var gy = Y(expo(gLeft)) + fs * 1.2;
gy = Math.min(gy, Y(lin(0.97)) - fs * 2.6);
var css =
':host{display:block;width:100%}' +
'svg{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}' +
'.ln{fill:none;stroke-width:var(--lw);stroke-linecap:round;stroke-linejoin:round}' +
'.t{stroke:var(--gap-chart-ink,#101a33)}' +
'.b{stroke:var(--gap-chart-accent,#2e63e8)}' +
'.ar{opacity:.85}' +
'.td{stroke:var(--gap-chart-dash,#a9b2c2);stroke-width:1.4;stroke-dasharray:1 5;stroke-linecap:round}' +
'.ax{stroke:var(--gap-chart-axis,#e4e8ef);stroke-width:1}' +
'text{fill:var(--gap-chart-muted,#5c6470)}' +
'.lt text{fill:var(--gap-chart-ink,#101a33);font-weight:600}' +
'.lb text{fill:var(--gap-chart-accent,#2e63e8);font-weight:600}' +
'.g1{fill:var(--gap-chart-ink,#101a33);font-weight:600}' +
'.zs{fill:none;stroke:transparent;stroke-width:30}' +
'.zf{fill:transparent}' +
'[data-z]{cursor:pointer}' +
'.ln,.ar,.lt,.lb,.lg{transition:opacity .25s,stroke-width .25s}' +
'svg[data-hi=top] .b,svg[data-hi=top] .ar,svg[data-hi=top] .lb,svg[data-hi=top] .lg{opacity:.3}' +
'svg[data-hi=top] .t{stroke-width:calc(var(--lw)*1.5)}' +
'svg[data-hi=bot] .t,svg[data-hi=bot] .ar,svg[data-hi=bot] .lt,svg[data-hi=bot] .lg{opacity:.3}' +
'svg[data-hi=bot] .b{stroke-width:calc(var(--lw)*1.5)}' +
'svg[data-hi=gap] .ar{opacity:1}' +
'svg[data-hi=gap] .lt,svg[data-hi=gap] .lb{opacity:.35}' +
'@media (prefers-reduced-motion:reduce){.ln,.ar,.lt,.lb,.lg{transition:none}}';
var stop = 'style="stop-color:var(--gap-chart-accent,#2e63e8)"';
this.root.innerHTML = '<style>' + css + '</style>' +
'<svg viewBox="0 0 ' + w + ' ' + h + '" style="--lw:' + lw + 'px"' +
' role="img" aria-label="' + this.a('alt') + '"' +
' xmlns="http://www.w3.org/2000/svg">' +
'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">' +
'<stop offset="0" stop-opacity=".05" ' + stop + '/>' +
'<stop offset="1" stop-opacity=".2" ' + stop + '/>' +
'</linearGradient></defs>' +
'<path class="ar" d="' + area + '" fill="url(#g)"/>' +
'<line class="ax" x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(1) + '" y2="' + Y(0) + '"/>' +
'<line class="td" x1="' + X(tx) + '" y1="' + Y(0) + '" x2="' + X(tx) + '" y2="' + (Y(expo(tx)) + 6) + '"/>' +
'<path class="ln t" d="' + top + '"/>' +
'<path class="ln b" d="' + bot + '"/>' +
this.lineLabels(w, X, Y, lin, fs, lw, padT) +
'<g class="lg" data-z="gap">' +
'<text class="g1" x="' + gcx + '" y="' + gy + '" text-anchor="middle" font-size="' + (fs + 1) + '">' + this.a('label-gap') + '</text>' +
'<text x="' + gcx + '" y="' + (gy + fs * 1.5) + '" text-anchor="middle" font-size="' + fs + '">' + this.a('label-gap-sub') + '</text></g>' +
'<g><text x="' + X(0) + '" y="' + (h - 3) + '" font-size="' + fst + '">' + this.a('tick-start') + '</text>' +
'<text x="' + X(tx) + '" y="' + (h - 3) + '" text-anchor="middle" font-size="' + fst + '">' + this.a('tick-today') + '</text>' +
'<text x="' + X(1) + '" y="' + (h - 3) + '" text-anchor="end" font-size="' + fst + '">' + this.a('tick-end') + '</text></g>' +
'<g aria-hidden="true">' +
'<path class="zf" data-z="gap" d="' + area + '"/>' +
'<path class="zs" data-z="top" d="' + top + '"/>' +
'<path class="zs" data-z="bot" d="' + bot + '"/>' +
'</g></svg>';
this.wire();
}
lineLabels(w, X, Y, lin, fs, lw, padT) {
if (w < 620) {
var lx = X(0.02), sw = 18, r1 = padT + fs, r2 = padT + fs * 2.7;
var row = function (cls, z, y, label) {
return '<g class="' + cls + '" data-z="' + z + '">' +
'<line class="' + (z === 'top' ? 't' : 'b') + '" x1="' + lx +
'" y1="' + (y - fs * 0.32) + '" x2="' + (lx + sw) + '" y2="' + (y - fs * 0.32) +
'" stroke-width="' + lw + '" stroke-linecap="round"/>' +
'<text x="' + (lx + sw + 7) + '" y="' + y + '" font-size="' + fs + '">' + label + '</text></g>';
};
return row('lt', 'top', r1, this.a('label-top')) +
row('lb', 'bot', r2, this.a('label-bottom'));
}
return '<g class="lt" data-z="top"><text x="' + X(0.6) + '" y="' + Y(0.88) +
'" text-anchor="middle" font-size="' + (fs + 1) + '">' + this.a('label-top') + '</text></g>' +
'<g class="lb" data-z="bot"><text x="' + X(0.62) + '" y="' + (Y(lin(0.62)) - fs * 0.9) +
'" text-anchor="middle" font-size="' + fs + '">' + this.a('label-bottom') + '</text></g>';
}
wire() {
var self = this;
var svg = this.root.querySelector('svg');
var set = function (z) {
if (z) svg.setAttribute('data-hi', z);
else svg.removeAttribute('data-hi');
};
var zone = function (e) {
var el = e.target.closest && e.target.closest('[data-z]');
return el ? el.getAttribute('data-z') : null;
};
svg.addEventListener('pointerover', function (e) { set(zone(e) || self._pin); });
svg.addEventListener('pointerleave', function () { set(self._pin); });
svg.addEventListener('click', function (e) {
var z = zone(e);
self._pin = (z && z !== self._pin) ? z : null;
set(self._pin || z);
});
set(this._pin);
}
}
customElements.define('gap-chart', GapChart);
})();
</script>
